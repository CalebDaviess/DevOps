services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: devops-jenkins-docker:2.580.2
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
    external: true
